# Gate configuration for `uv run python gate.py`.
#
# Every key is a flag of `ontology-quality-suite run`, spelled with
# underscores; `gate.py --help` lists them and the suite's own `--help`
# defines them. Paths are relative to this file.
#
# This copy points at the competency-test worked example, so the gate is
# runnable straight from a clone. A real project's copy sits at its own root
# and names its own folders.

# One root ontology. owl:imports pulls in the rest -- an integration file
# that imports each of the project's ontologies is the usual shape, and
# import_dir says where the local copies live.
ontology: competency_tests/fixtures/model/ontology/water-v1.ttl
import_dir: competency_tests/fixtures/model/ontology

# The TARQL/oxi-gen mappings, and the CSVs they read.
queries: competency_tests/fixtures/model/queries
query_pattern: "**/*.rq"
csv_dir: competency_tests/fixtures/model/csv

# Project-local checks *alongside* the suite's own, not instead of them.
#
# `sparql` is a list because the flag is repeatable (suite 0.18.0). It used to
# take one directory and silently replace the built-in tree: this gate ran the
# eight CMP-* queries below and none of the suite's 42, while the merged
# registry declared all 61 -- a clean-looking gate that had skipped nearly
# everything it was built to catch. The suite now warns when the built-in tree
# is left out, and naming both here means it never is.
#
# `@builtin` is the suite's own tree wherever this install put it -- the
# source checkout for an editable install, site-packages for a wheel. Writing
# the absolute path here instead would be wrong on every other machine and
# wrong again after an upgrade.
registry: competency_tests/results/merged-registry.json
sparql:
  - competency_tests/checks/sparql/competency
  - "@builtin"

# Keep a gate fast and repeatable: the portable SPARQL formulation, and
# owlrl closure rather than an external DL reasoner. Move the deep run to a
# nightly job rather than paying for it on every push.
engine: sparql
reasoner: owlrl-only

# Report only what this project is responsible for. Without it, an imported
# vocabulary's own style and metadata findings fail your build.
own_namespace: https://example.org/water/

out_dir: out/gate/ci
fail_on: Violation
