[project]
name = "owl2-error-detection-tests"
version = "0.1.0"
description = "Deliberately broken OWL2 ontologies + a harness asserting the Ontology Quality Suite detects each seeded error"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Peter Winstanley" }]
requires-python = ">=3.12"
dependencies = [
    # The native-shacl extra installs the `shacl` engine the suite can run
    # instead of pyshacl (`--engine native`). Pulled in here so the engine
    # parity test in tests/test_detection.py has something to compare
    # against; suite 0.14.4 pinned it to <0.4 after 0.3.0 changed what
    # sh:conforms means.
    # >=0.18.0 for the repeatable --sparql that ontology-suite.yml's `@builtin`
    # entry depends on. Against 0.17.0 the gate resolves it as a directory
    # name, finds nothing there, and runs this project's eight checks alone.
    # The uv source below makes this a local editable install, so the bound
    # documents the requirement rather than enforcing it here.
    "ontology-quality-suite[native-shacl]>=0.18.0",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
ontology-quality-suite = { path = "../consolidated_ontology_suite_python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
