[project]
name = "owl2-error-detection-tests"
version = "0.1.0"
description = "Deliberately broken OWL2 ontologies + a harness asserting the Ontology Quality Suite detects each seeded error"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Peter Winstanley" }]
requires-python = ">=3.12"
dependencies = [
    # No extra: `native-shacl` is an empty list upstream now, kept only so
    # that an older `uv sync --extra native-shacl` still resolves. The `shacl`
    # engine it used to install is a plain runtime dependency of the suite as
    # of 0.22.0, which moved the checks onto `shacl` and holosdb and dropped
    # pyshacl (now dev-only upstream, for its own parity tests).
    #
    # >=0.22.0 is what this harness reads rather than the oldest suite it
    # could run against: `--engine shacl` names that engine from 0.22.0 on,
    # where before it named pyshacl, so tests/test_detection.py asks an older
    # suite a different question than the one it is asserting. The counts
    # recorded in README.md and competency_tests/results/ are 0.24.3's. It
    # also subsumes the older floor of 0.18.0, for the repeatable --sparql
    # that ontology-suite.yml's `@builtin` entry needs: against 0.17.0 the
    # gate reads `@builtin` as a directory name, finds nothing there, and
    # runs this project's eight CMP checks alone.
    #
    # The uv source below makes this a local editable install, so the bound
    # documents the requirement rather than enforcing it here.
    "ontology-quality-suite>=0.22.0",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
ontology-quality-suite = { path = "../consolidated_ontology_suite_python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
