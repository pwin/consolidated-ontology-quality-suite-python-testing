# The defaults: the suite's own checks, at the severities the checks declare.
#
# Nothing here mentions severity at all. This is the reading you get when you
# do not ask for another one, and it is the baseline the policy runs are
# compared against.
#
# Paths resolve against this file, so the run works from any directory.
ontology: myOntology.ttl
engine: both
own_namespace: https://example.org/mine
fail_on: Violation
out_dir: out/defaults
